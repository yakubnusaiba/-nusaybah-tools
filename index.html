         <!-- ===== SUMMARIZER ===== -->
         <div class="page" id="page-summarizer">
             <div class="card">
                 <h2><i class="fas fa-compress-alt"></i> Text Summarizer</h2>
                 <p class="sub">Summarize long text into key points with intelligent extraction.</p>
                 <div class="form-group">
                     <label>Enter Text to Summarize</label>
                     <textarea id="summarizerInput" rows="8" placeholder="Paste your long text here..."></textarea>
                     <div class="char-counter"><span id="summarizerCharCount">0</span> characters</div>
                 </div>
                 <div class="form-group" style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
                     <label style="font-weight:600; margin:0;">Summary Length</label>
                     <select id="summaryLength" style="padding:0.4rem 0.8rem; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--text);">
                         <option value="short">Short (3 sentences)</option>
                         <option value="medium" selected>Medium (5 sentences)</option>
                         <option value="long">Long (8 sentences)</option>
                     </select>
                     <button class="btn" onclick="summarizeText()"><i class="fas fa-compress-alt"></i> Summarize</button>
                 </div>
                 <div class="output-box" id="summarizerOutput">
                     <div id="summarizerResult"></div>
                 </div>
             </div>
         </div>
